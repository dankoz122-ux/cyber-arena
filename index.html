<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Arena Online: RPG Edition</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0; background-color: #030308; color: #fff;
            font-family: 'Courier New', Courier, monospace; overflow: hidden;
            display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh;
        }
        #ui {
            display: flex; justify-content: space-between; width: 1200px; margin-bottom: 12px;
            background: rgba(6, 6, 14, 0.9); padding: 15px; border: 2px solid #00ffcc;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.4); border-radius: 4px; backdrop-filter: blur(5px);
        }
        .player-info { width: 42%; font-size: 13px; }
        .local-color { color: #ff0055; text-shadow: 0 0 8px #ff0055; }
        .enemy-color { color: #00ffcc; text-shadow: 0 0 8px #00ffcc; }
        .stats-display { font-size: 11px; margin-top: 4px; opacity: 0.9; letter-spacing: 0.5px; }
        .bar { background: #111122; height: 12px; border: 1px solid #333355; margin-top: 4px; border-radius: 2px; overflow: hidden; }
        .fill { height: 100%; width: 100%; }
        .hp-fill { background: linear-gradient(90deg, #ff0055, #ff5588); box-shadow: 0 0 10px #ff0055; }
        .cd-fill { background: linear-gradient(90deg, #d200ff, #ff00ee); box-shadow: 0 0 10px #ff00ee; width: 0%; }
        #game-container { position: relative; width: 1200px; height: 700px; border: 3px solid #ff0055; box-shadow: 0 0 25px rgba(255, 0, 85, 0.3); border-radius: 4px; overflow: hidden; }
        canvas { background: #04040c; display: block; }
        #legend { display: flex; justify-content: space-between; width: 1200px; margin-top: 10px; font-size: 11px; background: rgba(6, 6, 14, 0.8); padding: 8px 20px; border: 1px solid #333366; border-radius: 4px; color: #888; }
    </style>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>
    <div id="ui">
        <div class="player-info local-color">
            <strong>[ВЫ] Agent_<span id="local-id">...</span></strong>
            <div class="stats-display">LVL: <span id="local-lvl">1</span> | DMG: <span id="local-dmg">12</span> (+0) | SPD: <span id="local-spd">5.5</span></div>
            <div style="margin-top: 4px;">SYNC: <span id="local-hp-text">100</span>% | SYS: <span id="local-skill">READY</span></div>
            <div class="bar"><div id="local-hp" class="fill hp-fill"></div></div>
            <div class="bar"><div id="local-cd" class="fill cd-fill"></div></div>
        </div>
        <div id="connection-status" style="align-self: center; color: #ffaa00; text-shadow: 0 0 5px #ffaa00; font-size: 12px;">ПОДКЛЮЧЕНИЕ...</div>
        <div class="player-info enemy-color" style="text-align: right;">
            <strong>[ВРАГ] Agent_<span id="enemy-id">...</span></strong>
            <div class="stats-display">LVL: <span id="enemy-lvl">1</span> | DMG: <span id="enemy-dmg">12</span> | SPD: <span id="enemy-spd">5.5</span></div>
            <div style="margin-top: 4px;">SYNC: <span id="enemy-hp-text">100</span>% | SYS: <span id="enemy-skill">READY</span></div>
            <div class="bar"><div id="enemy-hp" class="fill hp-fill"></div></div>
            <div class="bar"><div id="enemy-cd" class="fill cd-fill"></div></div>
        </div>
    </div>
    <div id="game-container"><canvas id="gameCanvas" width="1200" height="700"></canvas></div>
    <div id="legend"><span>Уничтожайте <span style="color:#888888; text-shadow:0 0 3px #fff;">СЕРЫХ ДРОНОВ</span> ради мгновенного СУПЕР-ПРИРОСТА матрицы!</span><span>Render RPG Engine v2.0</span></div>

    <script>
        const socket = io(window.location.origin, { transports: ['websocket'], upgrade: false }); 

        const canvas = document.getElementById('gameCanvas'); const ctx = canvas.getContext('2d');
        let WORLD = { width: 4000, height: 2400 }; let localId = null;
        let anomalies = [], buildings = [], players = {}, bullets = [], items = [], creeps = [], particles = []; const keys = {};
        let mouseWorldX = 0, mouseWorldY = 0, currentCamX = 0, currentCamY = 0;
        const controls = { up: 'KeyW', down: 'KeyS', left: 'KeyA', right: 'KeyD', skill: 'ShiftLeft' };
        
        let localPlayer = { x: 2000, y: 1200, radius: 20, speed: 5.5, baseSpeed: 5.5, damage: 12, hp: 100, lvl: 1, skillCD: 0, skillActive: false, skillTimer: 0, dirX: 0, dirY: 0, aimX: 1, aimY: 0, lastShot: 0, shotDelay: 220 };

        window.addEventListener('mousemove', e => { const r = canvas.getBoundingClientRect(); mouseWorldX = e.clientX - r.left + currentCamX; mouseWorldY = e.clientY - r.top + currentCamY; });
        window.addEventListener('mousedown', e => { if (e.button === 0) keys['MouseLeft'] = true; });
        window.addEventListener('mouseup', e => { if (e.button === 0) keys['MouseLeft'] = false; });
        window.addEventListener('keydown', e => keys[e.code] = true); window.addEventListener('keyup', e => keys[e.code] = false);

        socket.on('init', data => {
            localId = data.id; WORLD = data.world; anomalies = data.anomalies; buildings = data.buildings; players = data.players; creeps = data.creeps || [];
            Object.assign(localPlayer, { x: players[localId].x, y: players[localId].y, color: players[localId].color, bulletColor: players[localId].bulletColor });
            document.getElementById('local-id').innerText = localId.substring(0, 4);
            document.getElementById('connection-status').innerText = "ОНЛАЙН СИНХРОНИЗАЦИЯ"; document.getElementById('connection-status').style.color = "#00ffcc";
        });
        
        socket.on('stateUpdate', data => { 
            bullets = data.bullets; items = data.items; creeps = data.creeps || [];
            for (let id in data.players) { 
                if (id !== localId) { 
                    players[id] = data.players[id]; 
                    document.getElementById('enemy-id').innerText = id.substring(0, 4); 
                    document.getElementById('connection-status').style.display = "none"; 
                } 
            } 
        });
        
        socket.on('damageTaken', dmg => { if (localPlayer.color === '#00ffcc' && localPlayer.skillActive) return; localPlayer.hp = Math.max(0, localPlayer.hp - dmg); });
        socket.on('bulletExplode', data => { for (let i = 0; i < 12; i++) particles.push({ x: data.x, y: data.y, vx: (Math.random()-0.5)*6, vy: (Math.random()-0.5)*6, radius: Math.random()*3+1, color: data.color, alpha: 1, decay: Math.random()*0.03+0.02 }); });
        
        // Получение супер-прокачки за убийство крипа
        socket.on('creepKilled', data => {
            for (let i = 0; i < 15; i++) particles.push({ x: data.x, y: data.y, vx: (Math.random()-0.5)*8, vy: (Math.random()-0.5)*8, radius: Math.random()*4+1, color: '#ffff00', alpha: 1, decay: 0.02 });
            if (data.killerSocketId === localId) {
                localPlayer.lvl += 1;
                let roll = Math.random();
                if (roll < 0.33) { localPlayer.damage += 6; } 
                else if (roll < 0.66) { localPlayer.speed = Math.min(9.5, localPlayer.speed + 0.9); } 
                else { localPlayer.hp = Math.min(100, localPlayer.hp + 40); }
            }
        });
        socket.on('playerLeft', id => { delete players[id]; document.getElementById('connection-status').innerText = "ВРАГ ВЫШЕЛ"; document.getElementById('connection-status').style.display = "block"; });
        function isCollidingWithBuilding(px, py, radius, b) { let cX = Math.max(b.x, Math.min(px, b.x + b.w)), cY = Math.max(b.y, Math.min(py, b.y + b.h)); return (px - cX)**2 + (py - cY)**2 < radius**2; }

        function updateLocalMovement() {
            if (!localId) return; let currentSpeed = localPlayer.speed;
            
            anomalies.forEach(a => { 
                if (Math.hypot(localPlayer.x - a.x, localPlayer.y - a.y) < a.radius) { 
                    if (a.type === 'sludge') currentSpeed *= 0.45; 
                    if (a.type === 'toxic') localPlayer.hp = Math.max(0, localPlayer.hp - 0.05); 
                    if (a.type === 'heal' && localPlayer.hp < 100) localPlayer.hp = Math.min(100, localPlayer.hp + 0.04); 
                } 
            });
            if (localPlayer.color === '#ff0055' && localPlayer.skillActive) currentSpeed *= 1.6;

            let mx = 0, my = 0; if (keys[controls.up]) my = -1; if (keys[controls.down]) my = 1; if (keys[controls.left]) mx = -1; if (keys[controls.right]) mx = 1;
            if (mx !== 0 || my !== 0) {
                const len = Math.sqrt(mx*mx + my*my); localPlayer.dirX = mx / len; localPlayer.dirY = my / len;
                let nextX = localPlayer.x + localPlayer.dirX * currentSpeed; if (!buildings.some(b => isCollidingWithBuilding(nextX, localPlayer.y, localPlayer.radius, b))) localPlayer.x = nextX;
                let nextY = localPlayer.y + localPlayer.dirY * currentSpeed; if (!buildings.some(b => isCollidingWithBuilding(localPlayer.x, nextY, localPlayer.radius, b))) localPlayer.y = nextY;
            }
            let dx = mouseWorldX - localPlayer.x, dy = mouseWorldY - localPlayer.y, dM = Math.hypot(dx, dy); if (dM > 1) { localPlayer.aimX = dx / dM; localPlayer.aimY = dy / dM; }

            if (keys[controls.skill] && localPlayer.skillCD <= 0 && !localPlayer.skillActive) { localPlayer.skillActive = true; localPlayer.skillTimer = localPlayer.color === '#ff0055' ? 3500 : 4500; localPlayer.skillCD = localPlayer.color === '#ff0055' ? 10000 : 12000; }
            if (localPlayer.skillCD > 0) localPlayer.skillCD -= 16.66; if (localPlayer.skillActive) { localPlayer.skillTimer -= 16.66; if (localPlayer.skillTimer <= 0) localPlayer.skillActive = false; }

            const now = Date.now();
            if (keys['MouseLeft'] && now - localPlayer.lastShot > localPlayer.shotDelay) { 
                socket.emit('shoot', { x: localPlayer.x + localPlayer.aimX * localPlayer.radius, y: localPlayer.y + localPlayer.aimY * localPlayer.radius, vx: localPlayer.aimX * 13, vy: localPlayer.aimY * 13, damage: localPlayer.damage, ownerId: localId, ownerColor: localPlayer.color, color: localPlayer.bulletColor }); 
                localPlayer.lastShot = now; 
            }

            // Стабильный подбор чипов (удаление происходит на сервере, клиент считывает изменения)
            items.forEach((item) => { 
                if (Math.hypot(localPlayer.x - item.x, localPlayer.y - item.y) < localPlayer.radius + 13) { 
                    if (item.type === 'heal') localPlayer.hp = Math.min(100, localPlayer.hp + 25); 
                    if (item.type === 'damage') { localPlayer.damage += 3; } 
                    if (item.type === 'speed') { localPlayer.speed = Math.min(9.5, localPlayer.speed + 0.4); } 
                    localPlayer.lvl += 1;
                    socket.emit('shoot', { x: -999, y: -999, vx: 0, vy: 0, damage: 0, ownerColor: 'clean', color: 'clean' }); // пинг серверу
                } 
            });
            
            if (localPlayer.hp <= 0) { localPlayer.hp = 100; localPlayer.speed = localPlayer.baseSpeed; localPlayer.damage = 12; localPlayer.lvl = 1; localPlayer.x = Math.random()*3000 + 500; localPlayer.y = Math.random()*2000 + 200; }
            socket.emit('playerUpdate', { x: localPlayer.x, y: localPlayer.y, aimX: localPlayer.aimX, aimY: localPlayer.aimY, skillActive: localPlayer.skillActive, skillCD: localPlayer.skillCD, hp: localPlayer.hp, speed: localPlayer.speed, damage: localPlayer.damage, lvl: localPlayer.lvl });
        }

        function updateUI() {
            if (!localId) return;
            document.getElementById('local-hp').style.width = localPlayer.hp + '%'; document.getElementById('local-hp-text').innerText = Math.round(localPlayer.hp);
            document.getElementById('local-lvl').innerText = localPlayer.lvl;
            document.getElementById('local-dmg').innerText = localPlayer.damage;
            document.getElementById('local-dmg').innerHTML = `${localPlayer.damage} <span style="color:#ffaa00">(+${localPlayer.damage - 12})</span>`;
            document.getElementById('local-spd').innerText = localPlayer.speed.toFixed(1);
            
            document.getElementById('local-skill').innerText = localPlayer.skillActive ? "ACTIVE" : (localPlayer.skillCD > 0 ? `CD:${Math.ceil(localPlayer.skillCD/1000)}s` : "READY");
            document.getElementById('local-cd').style.width = localPlayer.skillActive ? '100%' : (localPlayer.skillCD > 0 ? (localPlayer.skillCD / (localPlayer.color === '#ff0055' ? 10000 : 12000)) * 100 : 0) + '%';
            
            for (let id in players) { 
                if (id !== localId) { 
                    let enemy = players[id]; 
                    document.getElementById('enemy-hp').style.width = enemy.hp + '%'; document.getElementById('enemy-hp-text').innerText = Math.round(enemy.hp); 
                    document.getElementById('enemy-lvl').innerText = enemy.lvl || 1;
                    document.getElementById('enemy-dmg').innerText = enemy.damage || 12;
                    document.getElementById('enemy-spd').innerText = enemy.speed ? enemy.speed.toFixed(1) : "5.5";
                    document.getElementById('enemy-skill').innerText = enemy.skillActive ? "ACTIVE" : (enemy.skillCD > 0 ? `CD:${Math.ceil(enemy.skillCD/1000)}s` : "READY"); 
                    document.getElementById('enemy-cd').style.width = enemy.skillActive ? '100%' : '0%'; 
                } 
            }
        }

        function gameLoop() {
            updateLocalMovement(); ctx.clearRect(0, 0, canvas.width, canvas.height);
            currentCamX = Math.max(0, Math.min(WORLD.width - canvas.width, localPlayer.x - canvas.width / 2)); currentCamY = Math.max(0, Math.min(WORLD.height - canvas.height, localPlayer.y - canvas.height / 2));
            ctx.save(); ctx.translate(-currentCamX, -currentCamY);

            anomalies.forEach(a => { let cls = {toxic: 'rgba(255, 0, 85, 0.05)', sludge: 'rgba(255, 200, 0, 0.04)', heal: 'rgba(0, 255, 85, 0.04)'}, strs = {toxic: '#ff0055', sludge: '#ffaa00', heal: '#00ff55'}; ctx.fillStyle = cls[a.type]; ctx.beginPath(); ctx.arc(a.x, a.y, a.radius, 0, Math.PI*2); ctx.fill(); ctx.strokeStyle = strs[a.type]; ctx.lineWidth = 2; ctx.stroke(); });
            ctx.fillStyle = '#050510'; ctx.strokeStyle = '#2d2d66'; ctx.lineWidth = 3; buildings.forEach(b => { ctx.fillRect(b.x, b.y, b.w, b.h); ctx.strokeRect(b.x, b.y, b.w, b.h); });
            items.forEach(i => { ctx.beginPath(); ctx.arc(i.x, i.y, 13, 0, Math.PI*2); ctx.fillStyle = i.color; ctx.fill(); ctx.fillStyle = '#000'; ctx.font = 'bold 9px Arial'; ctx.fillText(i.label, i.x-6, i.y+3); });
            
            // РЕНДЕРИНГ КРИПОВ-ДРОНОВ
            creeps.forEach(c => {
                ctx.save(); ctx.shadowBlur = 8; ctx.shadowColor = '#666'; ctx.fillStyle = '#3a3a44'; ctx.beginPath(); ctx.arc(c.x, c.y, c.radius, 0, Math.PI*2); ctx.fill();
                ctx.strokeStyle = '#888'; ctx.lineWidth = 2; ctx.stroke(); ctx.restore();
                // Полоска здоровья крипа
                ctx.fillStyle = '#ff3333'; ctx.fillRect(c.x - 14, c.y - 22, 28 * (c.hp / c.maxHp), 3);
            });

            bullets.forEach(b => { ctx.save(); ctx.shadowBlur = 10; ctx.shadowColor = b.color; ctx.lineWidth = 4; ctx.strokeStyle = b.color; ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x - b.vx * 1.5, b.y - b.vy * 1.5); ctx.stroke(); ctx.restore(); });
            particles.forEach((p, i) => { p.x += p.vx; p.y += p.vy; p.alpha -= p.decay; ctx.save(); ctx.globalAlpha = p.alpha; ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI*2); ctx.fill(); ctx.restore(); if(p.alpha<=0) particles.splice(i,1); });

            ctx.save(); ctx.shadowBlur = localPlayer.skillActive ? 30 : 15; ctx.shadowColor = localPlayer.color; ctx.beginPath(); ctx.arc(localPlayer.x, localPlayer.y, localPlayer.radius, 0, Math.PI*2); ctx.fillStyle = localPlayer.color; ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke(); ctx.restore();
            ctx.beginPath(); ctx.moveTo(localPlayer.x, localPlayer.y); ctx.lineTo(localPlayer.x + localPlayer.aimX*26, localPlayer.y + localPlayer.aimY*26); ctx.strokeStyle = '#fff'; ctx.lineWidth = 4; ctx.stroke();

            for (let id in players) { if (id !== localId) { let p = players[id]; ctx.save(); ctx.shadowBlur = p.skillActive ? 30 : 15; ctx.shadowColor = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI*2); ctx.fillStyle = p.color; ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke(); ctx.restore(); ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x + p.aimX*26, p.y + p.aimY*26); ctx.strokeStyle = '#fff'; ctx.lineWidth = 4; ctx.stroke(); if(p.color === '#00ffcc' && p.skillActive) { ctx.beginPath(); ctx.arc(p.x, p.y, p.radius+15, 0, Math.PI*2); ctx.strokeStyle = '#00ffcc'; ctx.lineWidth=3; ctx.stroke(); } } }
            if(localPlayer.color === '#00ffcc' && localPlayer.skillActive) { ctx.beginPath(); ctx.arc(localPlayer.x, localPlayer.y, localPlayer.radius+15, 0, Math.PI*2); ctx.strokeStyle = '#00ffcc'; ctx.lineWidth=3; ctx.stroke(); }
            ctx.restore(); updateUI(); requestAnimationFrame(gameLoop);
        }
        gameLoop();
    </script>
</body>
</html>
